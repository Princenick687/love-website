<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 1 - Find Nick ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(#041b15,#14532d);
height:100vh;
overflow:hidden;
color:white;
}

h1{
text-align:center;
padding:20px;
}

#game{
position:relative;
width:900px;
height:500px;
margin:20px auto;
border:4px solid white;
border-radius:20px;
background:#1d4d2b;
overflow:hidden;
}

#player{
position:absolute;
left:20px;
top:220px;
font-size:40px;
transition:.08s linear;
}

#nick{
position:absolute;
right:20px;
top:220px;
font-size:45px;
}

.rose{
position:absolute;
font-size:28px;
}

#info{
text-align:center;
font-size:22px;
margin-top:10px;
}

#message{
margin-top:20px;
font-size:30px;
text-align:center;
color:#ffd6e7;
font-weight:bold;
}

button{
display:none;
margin:25px auto;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:40px;
background:#ff4d88;
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<h1>🌹 Level 1 — Find Nick 🌹</h1>

<div id="info">
Collect all 5 roses, then reach Nick ❤️
<br><br>
Roses: <span id="score">0</span>/5
</div>

<div id="game">

<div id="player">❤️</div>

<div id="nick">🤵</div>

<div class="rose" style="left:120px;top:60px;">🌹</div>
<div class="rose" style="left:280px;top:400px;">🌹</div>
<div class="rose" style="left:450px;top:150px;">🌹</div>
<div class="rose" style="left:620px;top:340px;">🌹</div>
<div class="rose" style="left:760px;top:80px;">🌹</div>

</div>

<div id="message"></div>

<button id="next">
Continue Adventure ❤️
</button>

<script>

const player=document.getElementById("player");
const roses=document.querySelectorAll(".rose");
const scoreText=document.getElementById("score");
const message=document.getElementById("message");
const next=document.getElementById("next");

let x=20;
let y=220;
let score=0;

document.addEventListener("keydown",(e)=>{

const speed=15;

if(e.key==="ArrowUp") y-=speed;
if(e.key==="ArrowDown") y+=speed;
if(e.key==="ArrowLeft") x-=speed;
if(e.key==="ArrowRight") x+=speed;

if(x<0)x=0;
if(y<0)y=0;
if(x>860)x=860;
if(y>450)y=450;

player.style.left=x+"px";
player.style.top=y+"px";

roses.forEach(r=>{

if(r.style.display!="none"){

const rx=parseInt(r.style.left);
const ry=parseInt(r.style.top);

if(Math.abs(x-rx)<35 && Math.abs(y-ry)<35){

r.style.display="none";

score++;

scoreText.innerHTML=score;

}

}

});

if(score==5 && x>800){

message.innerHTML="❤️ I knew you'd find me, My Beautiful Imelda ❤️";

next.style.display="block";

}

});

next.onclick=()=>{

window.location.href="memory.html";

};

</script>

</body>
</html>
