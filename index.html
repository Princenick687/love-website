<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Beautiful ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h1{
    color:#ff3366;
    margin-bottom:10px;
}

p{
    color:#555;
    margin-bottom:20px;
}

.buttons{
    position:relative;
    height:70px;
    margin-bottom:20px;
}

button{
    border:none;
    padding:12px 30px;
    border-radius:40px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

#yes{
    background:#ff3366;
    color:white;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#ddd;
    color:black;
    position:absolute;
    left:230px;
}

#message{
    color:#ff3366;
    font-weight:bold;
    font-size:22px;
    min-height:35px;
    margin-bottom:20px;
}

#gameArea{
    width:100%;
    height:250px;
    border:2px dashed hotpink;
    border-radius:15px;
    background:#fff0f5;
    position:relative;
    overflow:hidden;
}

.gameHeart{
    position:absolute;
    font-size:35px;
    cursor:pointer;
    user-select:none;
}

.heart{
    position:absolute;
    animation:float 4s linear forwards;
}

@keyframes float{

0%{
opacity:1;
transform:translateY(0) scale(1);
}

100%{
opacity:0;
transform:translateY(-700px) scale(2);
}

}

</style>

</head>
<body>

<audio id="bgMusic" loop>
    <source src="love-song.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>❤️ Hey Beautiful ❤️</h1>

<p>Will you be my girlfriend forever? 🥺💕</p>

<div class="buttons">

<button id="yes">YES ❤️</button>

<button id="no">NO 🙈</button>

</div>

<div id="message"></div>

<h2>🎮 Catch 15 Hearts ❤️</h2>

<p>Score: <span id="score">0</span>/15</p>

<div id="gameArea"></div>

</div>

<script>

const music=document.getElementById("bgMusic");

let started=false;

document.addEventListener("click",()=>{

if(!started){

music.play();

started=true;

}

});

const no=document.getElementById("no");
const yes=document.getElementById("yes");
const message=document.getElementById("message");

let count=0;

const funny=[
"😂 Nice try!",
"🙈 Too slow!",
"❤️ Nope!",
"😜 Catch me!",
"🤣 Almost!",
"💕 Hehe!"
];

no.addEventListener("mouseover",()=>{

count++;

const x=Math.random()*(window.innerWidth-no.offsetWidth-20);
const y=Math.random()*(window.innerHeight-no.offsetHeight-20);

no.style.position="fixed";
no.style.left=x+"px";
no.style.top=y+"px";

if(count<=funny.length){

message.innerHTML=funny[count-1];

}

});

yes.addEventListener("click",()=>{

message.innerHTML="❤️ YAAAY!! I LOVE YOU ❤️";

for(let i=0;i<80;i++){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=["❤️","💕","💖","💘","💝"][Math.floor(Math.random()*5)];

heart.style.left=Math.random()*window.innerWidth+"px";

heart.style.top=window.innerHeight+"px";

heart.style.fontSize=(20+Math.random()*30)+"px";

heart.style.animationDuration=(2+Math.random()*2)+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},4000);

}

});

const gameArea=document.getElementById("gameArea");
const scoreDisplay=document.getElementById("score");

let score=0;

function spawnHeart(){

const heart=document.createElement("div");

heart.className="gameHeart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*(gameArea.clientWidth-40)+"px";

heart.style.top=Math.random()*(gameArea.clientHeight-40)+"px";

heart.onclick=()=>{

score++;

scoreDisplay.innerHTML=score;

heart.remove();

if(score>=15){

gameArea.innerHTML="<h2 style='margin-top:90px;color:#ff3366;'>🎉 Congratulations! ❤️<br>You unlocked my heart forever! 💖</h2>";

}else{

spawnHeart();

}

};

gameArea.appendChild(heart);

}

spawnHeart();

</script>

</body>
</html>
